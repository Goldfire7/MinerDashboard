<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - CKB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1e2433;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-purple: #a371f7;
            --accent-red: #f85149;
            --accent-pink: #f778ba;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
            --radius: 12px;
            --radius-sm: 8px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, var(--bg-primary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            line-height: 1.5;
        }
        
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        h1 { 
            color: var(--accent-red); 
            font-size: clamp(20px, 5vw, 26px); 
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .back-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
            transition: all 0.2s;
        }
        
        .back-link:hover {
            background: rgba(88, 166, 255, 0.2);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .stat-card {
            background: linear-gradient(145deg, var(--bg-tertiary), var(--bg-secondary));
            border-radius: var(--radius);
            padding: 18px 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: border-color 0.2s, transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
        }
        
        .stat-card .label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        
        .stat-card .value.tip { color: var(--accent-blue); }
        .stat-card .value.epoch { color: var(--accent-purple); }
        .stat-card .value.difficulty { color: var(--accent-yellow); }
        .stat-card .value.hashrate { color: var(--accent-green); }
        .stat-card .value.tx { color: var(--accent-pink); }
        .stat-card .value.reward { color: var(--accent-green); }
        .stat-card .value.countdown { color: var(--accent-purple); }
        
        .stat-card .sub-value {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 6px;
        }
        
        .epoch-card {
            grid-column: span 2;
        }
        
        @media (max-width: 600px) {
            .epoch-card {
                grid-column: span 1;
            }
        }
        
        .epoch-progress {
            margin-top: 12px;
        }
        
        .progress-bar {
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), #bc8cff);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .refresh-row {
            text-align: center;
            margin-top: 20px;
        }
        
        .refresh-btn {
            background: linear-gradient(90deg, #238636, #2ea043);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover { 
            background: linear-gradient(90deg, #2ea043, #3fb950);
            transform: translateY(-1px);
        }
        
        .refresh-btn:disabled { 
            background: var(--text-muted); 
            cursor: not-allowed;
            transform: none;
        }
        
        .loading { 
            color: var(--text-secondary); 
            text-align: center; 
            padding: 60px 20px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .loading::after {
            content: '';
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: var(--accent-red);
            text-align: center;
            padding: 60px 20px;
            font-size: 14px;
            background: rgba(248, 81, 73, 0.08);
            border-radius: var(--radius);
            border: 1px solid rgba(248, 81, 73, 0.2);
        }
        
        .last-updated {
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
            margin-top: 16px;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            body { padding: 12px; }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .stat-card {
                padding: 14px 12px;
            }
            
            .stat-card .value {
                font-size: 18px;
            }
            
            .stat-card .label {
                font-size: 10px;
            }
        }
        
        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>📉 Network Statistics</h1>
        <a href="/" class="back-link">← Dashboard</a>
    </header>
    
    <div id="statsContent">
        <div class="loading">Loading statistics...</div>
    </div>
    
    <div class="refresh-row">
        <button class="refresh-btn" onclick="loadStatistics()" id="refreshBtn">↻ Refresh</button>
    </div>
    
    <div class="last-updated" id="lastUpdated"></div>
    
    <script>
        function formatDifficulty(d) {
            if (!d) return '--';
            if (d >= 1e18) return (d / 1e18).toFixed(2) + ' EH';
            if (d >= 1e15) return (d / 1e15).toFixed(2) + ' PH';
            if (d >= 1e12) return (d / 1e12).toFixed(2) + ' TH';
            if (d >= 1e9) return (d / 1e9).toFixed(2) + ' GH';
            return (d / 1e6).toFixed(2) + ' MH';
        }
        
        function formatHashrate(h) {
            if (!h) return '--';
            return (h / 1e12).toFixed(2) + ' PH/s';
        }
        
        function formatNumber(num) {
            if (!num && num !== 0) return '--';
            return num.toLocaleString();
        }
        
        function loadStatistics() {
            const btn = document.getElementById('refreshBtn');
            const content = document.getElementById('statsContent');
            
            btn.disabled = true;
            btn.textContent = '⟳ Loading...';
            
            fetch('/api/statistics')
                .then(r => r.json())
                .then(data => {
                    btn.disabled = false;
                    btn.textContent = '↻ Refresh';
                    
                    if (data.error) {
                        content.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                        return;
                    }
                    
                    const epochPercent = Math.round((data.epoch_index / data.epoch_length) * 100);
                    
                    content.innerHTML = `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="label">Tip Block</div>
                                <div class="value tip">#${formatNumber(data.tip_block)}</div>
                                <div class="sub-value">Latest block height</div>
                            </div>
                            
                            <div class="stat-card epoch-card">
                                <div class="label">Current Epoch</div>
                                <div class="value epoch">#${formatNumber(data.epoch_number)}</div>
                                <div class="sub-value">${data.epoch_progress} • ${epochPercent}% complete</div>
                                <div class="epoch-progress">
                                    <div class="progress-bar">
                                        <div class="progress-fill" style="width: ${epochPercent}%"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="label">Network Hashrate</div>
                                <div class="value hashrate">${formatHashrate(data.hash_rate)}</div>
                                <div class="sub-value">Estimated network power</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="label">Current Difficulty</div>
                                <div class="value difficulty">${formatDifficulty(data.current_difficulty)}</div>
                                <div class="sub-value">Epoch difficulty target</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="label">Transactions (24h)</div>
                                <div class="value tx">${formatNumber(data.transactions_24h)}</div>
                                <div class="sub-value">~${data.tx_per_minute} tx/min</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="label">Avg Block Time</div>
                                <div class="value">${data.average_block_time_sec}s</div>
                                <div class="sub-value">${(data.average_block_time_sec * 1000).toFixed(0)}ms per block</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="label">Block Reward</div>
                                <div class="value reward">${data.block_reward.toLocaleString()} CKB</div>
                                <div class="sub-value">Per confirmed block</div>
                            </div>
                            
                            <div class="stat-card">
                                <div class="label">Epoch Remaining</div>
                                <div class="value countdown" id="epochRemaining">--</div>
                                <div class="sub-value" id="epochRemainingSub">Loading...</div>
                            </div>
                        </div>
                    `;
                    
                    const updated = new Date(data.updated_at);
                    document.getElementById('lastUpdated').textContent = `Last updated: ${updated.toLocaleString()}`;
                    
                    // Live countdown
                    const newRemainingMs = data.estimated_epoch_time_remaining_ms || 0;
                    const newTargetEpoch = `${data.epoch_number}-${data.epoch_index}-${data.epoch_length}`;
                    const storedTarget = localStorage.getItem('epochCountdownTarget');
                    const storedEpoch = localStorage.getItem('epochCountdownEpoch');
                    
                    let countdownTargetMs;
                    if (storedEpoch === newTargetEpoch && storedTarget) {
                        countdownTargetMs = parseInt(storedTarget, 10);
                    } else {
                        countdownTargetMs = Date.now() + newRemainingMs;
                        localStorage.setItem('epochCountdownTarget', countdownTargetMs);
                        localStorage.setItem('epochCountdownEpoch', newTargetEpoch);
                    }
                    
                    function updateEpochCountdown() {
                        const el = document.getElementById('epochRemaining');
                        const subEl = document.getElementById('epochRemainingSub');
                        if (!el) return;
                        
                        const remainingMs = Math.max(0, countdownTargetMs - Date.now());
                        
                        if (remainingMs <= 0) {
                            el.textContent = '0s';
                            subEl.textContent = 'Epoch transition imminent!';
                            clearInterval(window._epochInterval);
                            return;
                        }
                        
                        const totalSec = Math.floor(remainingMs / 1000);
                        const hrs = Math.floor(totalSec / 3600);
                        const mins = Math.floor((totalSec % 3600) / 60);
                        const secs = totalSec % 60;
                        
                        if (hrs > 0) {
                            el.textContent = `${hrs}h ${mins}m`;
                        } else if (mins > 0) {
                            el.textContent = `${mins}m ${secs}s`;
                        } else {
                            el.textContent = `${secs}s`;
                        }
                        
                        const remainingBlocks = data.epoch_length - data.epoch_index - 1;
                        subEl.textContent = `${remainingBlocks} blocks left • ~${data.average_block_time_sec}s/block`;
                    }
                    
                    updateEpochCountdown();
                    if (window._epochInterval) clearInterval(window._epochInterval);
                    window._epochInterval = setInterval(updateEpochCountdown, 1000);
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.textContent = '↻ Refresh';
                    content.innerHTML = `<div class="error">Failed to load statistics</div>`;
                    console.error(err);
                });
        }
        
        loadStatistics();
    </script>
</body>
</html>
